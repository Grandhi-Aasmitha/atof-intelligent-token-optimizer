[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atof-intelligent-token-optimizer"
version = "0.4.0"
description = "Capability-aware token optimization platform, phase 4"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110,<1", "uvicorn>=0.30,<1", "pydantic>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
atof-phase1 = "atof.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
atof = ["catalog/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
